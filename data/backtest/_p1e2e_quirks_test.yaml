company_quirks:
  00110893:
    '2024':
      content_chunks:
      - disclosure_type: 연결_지배구조
        part: I
        evidence: 연결대상회사수 비상장 216사에서 기말 227사로 변동, 연결대상회사의 변동내용에 신규연결 64개·연결제외 53개가
          기재되어 있으며 사유로 신규편입, 지배력상실, 청산이 제시됨.
        why_review: 연결범위 변동 규모가 크고 지배력상실·청산이 다수 발생해 연결판단, 처분손익·비지배지분 영향, 관련 공시의 일관성을
          점검할 필요가 있습니다.
      - disclosure_type: 메자닌_자금조달
        part: I
        evidence: 기타는 상환전환우선주이며, 2024년 3월 30일 3우선주 1,330,796주, 4우선주 2,091,253주, 5우선주
          950,569주를 주당 52,600원에 발행하였고, 발행인 상환권과 주주 전환권이 기재됨.
        why_review: 상환권·전환권이 결합된 종류주식 대규모 발행은 자본/부채 분류, 주당이익 희석, 향후 상환·전환 조건의 회계처리
          및 공시 적정성을 검토할 필요가 있습니다.
      - disclosure_type: 메자닌_자금조달
        part: III
        evidence: 연결 자본변동표에 '상환전환우선주의 발행'으로 자본금 21,863,090천원, 자본잉여금 207,833,518천원,
          합계 229,696,608천원이 반영됨.
        why_review: 메자닌성 자본조달이 재무제표에 직접 반영되어 있어 발행조건과 회계분류, 자본변동표 반영의 정합성을 확인할 필요가
          있습니다.
      - disclosure_type: 담보_보증
        part: III
        evidence: 연결구조화기업에 대한 재무지원으로 다수 SPC에 대해 '유동화증권의 만기일에 상환재원이 부족할 경우 대출채권을 매입하는
          약정 및 사모사채 인수확약'을 제공하고 있으며 한도금액이 기재됨.
        why_review: 유동화 구조화기업에 대한 매입약정·인수확약은 사실상 신용보강 성격이 있어 우발노출 규모, 실행 가능성, 충당부채/주석
          공시의 적정성을 검토할 필요가 있습니다.
      - disclosure_type: 담보_보증
        part: III
        evidence: 주석 8. 담보제공자산에서 주식·채무증권·대출채권·예치금 등이 한국증권금융, 한국거래소, 금융기관 등에 담보로 제공되어
          있으며, 주석 40에서도 투자부동산·대출채권 담보제공 내역이 상세히 기재됨.
        why_review: 담보제공 자산 종류와 규모가 다양하고 차입·RP·파생거래와 연계되어 있어 담보권 설정 범위, 관련 차입조건 및
          담보가치 공시를 점검할 필요가 있습니다.
      - disclosure_type: 우발_약정
        part: III
        evidence: 주석 40에서 미이행출자약정으로 Blackstone Real Estate Partners X.F LP 16,000천불
          중 11,886천불, KKR Next Generation Technology Growth Fund III SCSp 13,000천불
          중 8,436천불 등 미이행 출자약정이 기재됨.
        why_review: 향후 추가 자금집행 의무가 존재하므로 유동성 계획, 약정조건, 관련 공시의 완전성을 검토할 필요가 있습니다.
      - disclosure_type: 우발_약정
        part: XI
        evidence: 매입확약 항목으로 디비안흥제이차, 피제이자유로, 마이트창원상남동제일차 등 다수 거래상대방에 대해 한도금액 합계 105,400,000천원,
          실행금액 2,000,000천원, 미실행 한도 잔액 103,400,000천원이 기재됨.
        why_review: 매입확약은 장래 자금집행 가능성이 있는 우발약정이므로 약정 구조와 손실흡수 가능성, 충당부채 인식 여부를 검토할
          필요가 있습니다.
      - disclosure_type: 손상
        part: III
        evidence: 핵심감사사항에 '(2) 대출채권 및 기타포괄손익-공정가치측정 채무증권 기대신용손실에 대한 손실충당금 및 금융보증계약부채'가
          기재되어 있고, 주석 12에서 대출채권 손실충당금이 184,665,211천원으로 표시됨.
        why_review: 신용손실충당금은 경영진 추정이 큰 영역이며 감사 핵심사항으로도 제시되어 있어 ECL 가정, 단계분류, 담보반영
          및 변동 사유를 중점 검토할 필요가 있습니다.
      - disclosure_type: 손상
        part: III
        evidence: 영업권 손상검토 주석에서 대신저축은행, 대신에프앤아이 등에 배분된 영업권이 기재되고, DS Azabujuban 합동회사
          취득으로 영업권 4,231,921천원이 인식되며 사용가치 기반 손상검토가 서술됨.
        why_review: 영업권은 비상각 자산으로 손상검토 가정(할인율, 성장률 등)에 민감하므로 취득 후 배분과 손상검토의 합리성을 검토할
          필요가 있습니다.
      - disclosure_type: 소송_분쟁
        part: III
        evidence: 주석 40에서 대신증권 피고 12건 소송가액 11,094백만원, 대신저축은행 피고 48건 소송가액 34,394백만원,
          대신자산신탁 피소 84건 소송가액 31,384백만원 등 계류중인 소송사건이 기재됨.
        why_review: 계류 소송 규모와 건수가 적지 않아 충당부채 인식 여부, 우발부채 공시, 판결 진행상황 반영의 적정성을 점검할
          필요가 있습니다.
      - disclosure_type: 특수관계_대주주
        part: III
        evidence: 주석 42에서 특수관계자와의 중요한 채권·채무 및 거래내역이 상세히 기재되며, 예를 들어 신한AIM부동산전문투자형사모투자신탁제24호에
          대한 상각후원가측정금융자산 46,385,729천원, 이지스자산운용에 대한 상각후원가측정금융자산 49,795,250천원 등이 표시됨.
        why_review: 특수관계자와의 자금거래·수수료거래·채권채무가 다수 존재하므로 거래조건의 정상성, 회수가능성, 공시누락 여부를 검토할
          필요가 있습니다.
      - disclosure_type: 특수관계_대주주
        part: X
        evidence: 대주주에 대한 주식기준보상 거래 현황에서 양홍석 530,136주, 이어룡 329,924주, 오익근 103,206주
          등의 부여·지급·미지급 주식 수가 기재됨.
        why_review: 대주주 및 경영진에 대한 주식기준보상은 이해상충 가능성이 있는 영역이므로 부여기준, 이연·환수 조건, 공시의 완전성을
          검토할 필요가 있습니다.
      - disclosure_type: 감사_내부통제
        part: V
        evidence: 제64기 감사보고서 및 연결감사보고서 모두 한영회계법인 '적정의견'이며, 핵심감사사항으로 '공정가치 수준3 장외파생상품
          및 파생결합증권 공정가치 평가'와 '대출채권 기대신용손실 손실충당금 및 금융보증계약부채'가 제시됨.
        why_review: 감사의견은 적정이나 핵심감사사항이 명시되어 있어 고난도 평가·충당금 산정 영역의 회계추정과 공시를 감사 관점에서
          추가 검토할 필요가 있습니다.
      - disclosure_type: 감사_내부통제
        part: V
        evidence: 내부회계관리제도 및 연결내부회계관리제도에 대해 경영진, 감사위원회, 감사인 모두 '중요성의 관점에서 효과적으로 설계되어
          운영' 및 '적정의견'으로 기재됨.
        why_review: 내부회계 관련 비적정은 아니지만 공식 평가·감사 결과가 존재하므로 내부통제 체계와 관련 주석·운영실태 보고의 일관성을
          확인할 필요가 있습니다.
      - disclosure_type: 재작성_정정
        part: V
        evidence: 제63기 감사보고서 및 연결감사보고서의 강조사항에 '회계정책의 변경'이 기재되어 있으며, 재무에 관한 사항에서 2023년
          토지 측정방법을 원가모형에서 재평가모형으로 변경하였다고 서술됨.
        why_review: 전기 회계정책 변경이 존재하므로 비교표시, 자본 반영, 공시 문구와 실제 회계처리의 정합성을 검토할 필요가 있습니다.
      - disclosure_type: 차입_유동성
        part: IV
        evidence: 연결기준 순자본비율은 428.4%이며, 차입부채·사채·기업어음 등 차입구조와 만기구조가 상세히 제시되고, 부외거래로
          매입확약 1,054억원이 기재됨.
        why_review: 직접적인 유동성 위기 표현은 없으나 차입 및 확약 규모가 커 자금조달구조, 만기집중도, 유동성 관리 공시를 검토할
          필요가 있습니다.
  '00112457':
    '2024':
      content_chunks:
      - disclosure_type: 연결_지배구조
        part: III
        evidence: 전기중 종속법인인 농업회사법인 (주)남부팜의 청산으로 연결재무제표의 작성 대상 범위에 제외되었습니다.
        why_review: 전기에 종속기업 청산으로 연결범위 제외가 발생해 연결범위 변동의 경위와 재무영향 확인이 필요합니다.
      - disclosure_type: 담보_보증
        part: III
        evidence: 당기말 현재 연결회사의 장,단기차입금과 관련하여 담보로 제공된 자산의 내역은 다음과 같습니다.
        why_review: 차입금 관련 담보제공 자산과 설정금액이 구체적으로 공시되어 있어 담보 설정 범위와 차입조건 연계 검토가 필요합니다.
      - disclosure_type: 우발_약정
        part: III
        evidence: 수입신용장 개설과 관련한 약정사항은 다음과 같습니다.
        why_review: 외화지급보증 및 운전자금 한도약정 등 약정사항이 존재하므로 미실행 포함 약정 규모와 사용현황 검토가 필요합니다.
      - disclosure_type: 특수관계_대주주
        part: III
        evidence: 기타특수관계자 천안농산 3,501,242 / 8,805 ... 당기말 현재 특수관계자 채권에 대하여 대손충당금 233,546천원을
          설정하였으며, 당기 중 인식된 대손상각비는 233,546천원입니다.
        why_review: 특수관계자와의 매출·매입 거래 및 관련 채권, 대손충당금 설정이 있어 거래 실질과 회수가능성 확인이 필요합니다.
      - disclosure_type: 손상
        part: III
        evidence: 치크월드(*4) 전기이전에 전액 손상차손인식하였습니다.
        why_review: 금융자산 중 특정 비상장 지분에 전액 손상 인식 사실이 명시되어 있어 손상 인식 배경과 잔존 장부가액 확인이 필요합니다.
      - disclosure_type: 손상
        part: III
        evidence: 당기 중 인식된 대손상각비는 233,546천원입니다.
        why_review: 특수관계자 채권 관련 대손상각비와 전체 매출채권 대손충당금 증가가 있어 신용위험 및 충당금 산정 근거 검토가 필요합니다.
      - disclosure_type: 파생_시장위험
        part: III
        evidence: 연결회사는 주된 원재료의 환율변동위험을 회피하기 위하여 다음과 같은 파생상품계약을 체결하였으며 ... 계약금액 USD
          4,100,000
        why_review: 환헤지 목적 파생상품 계약과 관련 손익이 공시되어 있어 거래 목적, 규모, 평가·결제손익 검토가 필요합니다.
      - disclosure_type: 감사_내부통제
        part: V
        evidence: 제63기(당기) 감사보고서 우리회계법인 적정의견 ... 핵심감사사항 재고자산 실재성 및 평가
        why_review: 적정의견이지만 핵심감사사항으로 재고자산 실재성 및 평가가 제시되어 관련 감사 초점 사항 검토가 필요합니다.
      - disclosure_type: 감사_내부통제
        part: V
        evidence: 경영자의 내부회계관리제도 운영실태 평가보고서에 대한 우리의 감사결과 ... 작성되지 않았다고 판단하게 하는 점이 발견되지
          아니하였습니다.
        why_review: 내부회계관리제도 감사 결과가 공시되어 있어 내부통제 관련 감사범위와 결과 확인이 필요합니다.
  00108649:
    '2015':
      content_chunks:
      - disclosure_type: 메자닌_자금조달
        part: I
        evidence: '미상환 전환사채 발행현황: 제6회 무보증 사모전환사채 10억원, 제7회 무보증 사모전환사채 12억원이 기재되어 있습니다.'
        why_review: 전환사채가 당기말 현재 미상환 상태이며 발행조건(전환가액, 만기, 전환청구기간)과 자금사용 목적이 명시되어 있어
          메자닌 자금조달 검토 대상입니다.
      - disclosure_type: 메자닌_자금조달
        part: III
        evidence: 보고기간종료일 현재 전환사채의 내용은 다음과 같습니다. 제6회 무보증 사모사채 2013.9.25 발행, 제7회 무보증
          사모사채 2015.6.8 발행.
        why_review: 복합금융상품인 전환사채의 부채·자본 분리, 유동성대체, 상환할증금 및 전환조건이 재무제표에 반영되어 있어 회계처리와
          공시 정합성 검토가 필요합니다.
      - disclosure_type: 연결_지배구조
        part: III
