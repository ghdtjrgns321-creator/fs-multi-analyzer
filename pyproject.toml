[project]
name = "disclosure-review-agent"
version = "0.1.0"
description = "멀티에이전트 교차검증 기반 공시 재무제표·주석 변화 리뷰 도구"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "olefile>=0.47",
    "pdfplumber>=0.11.9",
    "pyhwp>=0.1b15",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
core = [
    "pandas>=2.2",
    "pandera",
    "duckdb",
    "pyyaml",
    "pydantic-settings",
    "OpenDartReader",
    "arelle-release",
    "beautifulsoup4",
]
agent = [
    "pydantic-ai",
    "openai",
    "google-genai",
]
dashboard = [
    "streamlit",
    "plotly",
    "streamlit-searchbox>=0.1.24",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# data/backtest는 일회성 분석·감사 하니스(운영코드 아님) → lint 게이트 제외.
extend-exclude = ["data/backtest"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: DART API·네트워크가 필요한 통합 테스트(미구성 시 skip)",
]
