[project]
name = "disclosure-review-agent"
version = "0.1.0"
description = "멀티에이전트 교차검증 기반 공시 재무제표·주석 변화 리뷰 도구"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "olefile>=0.47",
    "pdfplumber>=0.11.9",
    "pyhwp>=0.1b15",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
core = [
    "pandas>=2.2",
    "pandera",
    "duckdb",
    "pyyaml",
    "pydantic-settings",
    "OpenDartReader",
    "arelle-release",
    "beautifulsoup4",
]
agent = [
    "pydantic-ai",
    "openai",
    "google-genai",
]
dashboard = [
    "streamlit",
    "plotly",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
