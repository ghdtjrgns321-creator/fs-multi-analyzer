    aliases: [유동부채, 유동부채계]
  비유동부채:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_NoncurrentLiabilities
    aliases: [비유동부채, 비유동부채계]
  부채총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_Liabilities
    aliases: [부채총계]
  자본총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_Equity
