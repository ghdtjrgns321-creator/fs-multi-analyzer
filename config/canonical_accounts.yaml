# L1 canonical account mapping.
# 1순위: account_id 표준 ID(ifrs-full_*, dart_*). 2순위: aliases.
# Python 코드에 계정 코드·라벨을 하드코딩하지 않는다.

canonical_accounts:
  현금및현금성자산:
    statement: BS
    account_ids:
      - ifrs-full_CashAndCashEquivalents
    aliases: [현금및현금성자산]
  단기금융상품:
    statement: BS
    account_ids:
      - dart_ShortTermDepositsNotClassifiedAsCashEquivalents
      - ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents
    aliases: [단기금융상품]
  매출채권:
    statement: BS
    account_ids:
      - dart_ShortTermTradeReceivable
      - ifrs-full_CurrentTradeReceivables
    # 조합 수취채권 라벨은 매출채권 proxy로 사용한다. 장기/비유동 조합은 제외한다.
    aliases: [매출채권, 매출채권 및 기타유동채권, 매출채권 및 기타채권, 매출채권및기타채권]
  계약자산:
    statement: BS
    account_ids: []
    # K-IFRS 1115 진행률/수주 계약자산. 총계와 유동/비유동 구성요소가 같이 있으면 정규화에서 대표 1라인만 쓴다.
    aliases: [계약자산, 유동계약자산, 비유동계약자산, 미청구공사, 단기미청구공사, 미청구공사채권, 확정계약자산, 유동확정계약자산, 비유동확정계약자산]
  재고자산:
    statement: BS
    account_ids:
      - ifrs-full_Inventories
    aliases: [재고자산]
  미수금:
    statement: BS
    account_ids:
      - dart_ShortTermOtherReceivables
      - dart_ShortTermOtherReceivablesNet
    aliases: [미수금]
  선급비용:
    statement: BS
    account_ids:
      - dart_ShortTermPrepaidExpenses
      - ifrs-full_CurrentPrepaidExpenses
    aliases: [선급비용]
  기타유동자산:
    statement: BS
    account_ids:
      - ifrs-full_OtherCurrentAssets
    aliases: [기타유동자산]
  유동자산:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_CurrentAssets
    aliases: [유동자산, 유동자산계]
  자산총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_Assets
    aliases: [자산총계]
  자본과부채총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_EquityAndLiabilities
    aliases: [자본과부채총계, 부채와자본총계, 부채및자본총계]
  유동부채:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_CurrentLiabilities
    aliases: [유동부채, 유동부채계]
  비유동부채:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_NoncurrentLiabilities
    aliases: [비유동부채, 비유동부채계]
  부채총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_Liabilities
    aliases: [부채총계]
  자본총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_Equity
    aliases: [자본총계]
  지배기업소유주지분:
    statement: BS
    account_ids:
      - ifrs-full_EquityAttributableToOwnersOfParent
    aliases: [지배기업 소유주지분, 지배기업 소유지분]
  비지배지분:
    statement: BS
    account_ids:
      - ifrs-full_NoncontrollingInterests
    aliases: [비지배지분]
  비유동자산:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_NoncurrentAssets
    aliases: [비유동자산]
  관계기업투자:
    statement: BS
    account_ids:
      - ifrs-full_InvestmentAccountedForUsingEquityMethod
      - ifrs-full_InvestmentsInSubsidiariesJointVenturesAndAssociates
    aliases: [관계기업 및 공동기업 투자, 종속기업, 관계기업 및 공동기업 투자]
  무형자산:
    statement: BS
    account_ids:
      - ifrs-full_IntangibleAssetsAndGoodwill
      - ifrs-full_IntangibleAssetsOtherThanGoodwill
    aliases: [무형자산]
  이연법인세자산:
    statement: BS
    account_ids:
      - ifrs-full_DeferredTaxAssets
    aliases: [이연법인세자산]
  이연법인세부채:
    statement: BS
    account_ids:
      - ifrs-full_DeferredTaxLiabilities
    aliases: [이연법인세부채]
  매입채무:
    statement: BS
    account_ids:
      - ifrs-full_TradeAndOtherCurrentPayablesToTradeSuppliers
    # 조합 지급채무 라벨은 매입채무 proxy로 사용한다. 장기/비유동 조합은 제외한다.
    aliases: [매입채무, 매입채무 및 기타유동채무, 매입채무및기타채무, 매입채무 및 기타채무]
  계약부채:
    statement: BS
    account_ids: []
    # K-IFRS 1115 진행률/수주 계약부채. 총계와 유동/비유동 구성요소가 같이 있으면 정규화에서 대표 1라인만 쓴다.
    aliases: [계약부채, 유동계약부채, 비유동계약부채, 초과청구공사, 단기초과청구공사, 확정계약부채, 유동확정계약부채, 비유동확정계약부채]
  단기차입금:
    statement: BS
    account_ids:
      - ifrs-full_ShorttermBorrowings
    aliases: [단기차입금, 단기차입부채]
  미지급금:
    statement: BS
    account_ids:
      - ifrs-full_OtherCurrentPayables
    aliases: [미지급금]
  미지급비용:
    statement: BS
    account_ids:
      - ifrs-full_AccrualsClassifiedAsCurrent
    aliases: [미지급비용]
  선수금:
    statement: BS
    account_ids:
      - dart_ShortTermAdvancesCustomers
      - ifrs-full_CurrentAdvances
    aliases: [선수금]
  예수금:
    statement: BS
    account_ids:
      - dart_ShortTermWithholdings
    aliases: [예수금]
  당기법인세부채:
    statement: BS
    account_ids:
      - ifrs-full_CurrentTaxLiabilities
    aliases: [당기법인세부채]
  장기차입금:
    statement: BS
    account_ids:
      - dart_LongTermBorrowingsGross
      - ifrs-full_NoncurrentPortionOfNoncurrentLoansReceived
    aliases: [장기차입금]
  사채:
    statement: BS
    account_ids:
      - dart_BondsIssued
      - ifrs-full_NoncurrentPortionOfNoncurrentBondsIssued
    aliases: [사채]
  충당부채:
    statement: BS
    account_ids:
      - ifrs-full_CurrentProvisions
      - ifrs-full_OtherShorttermProvisions
    aliases: [충당부채]
  공사손실충당부채:
    statement: BS
    account_ids: []
    aliases: [공사손실충당부채]
  장기충당부채:
    statement: BS
    account_ids:
      - ifrs-full_NoncurrentProvisions
      - ifrs-full_OtherLongtermProvisions
    aliases: [장기충당부채]
  유형자산:
    statement: BS
    account_ids:
      - ifrs-full_PropertyPlantAndEquipment
    aliases: [유형자산]
  자본금:
    statement: BS
    account_ids:
      - ifrs-full_IssuedCapital
    aliases: [자본금]
  이익잉여금:
    statement: BS
    account_ids:
      - ifrs-full_RetainedEarnings
    aliases: [이익잉여금]
  주식발행초과금:
    statement: BS
    account_ids:
      - ifrs-full_SharePremium
    aliases: [주식발행초과금]
  매출:
    statement: IS
    account_ids:
      - ifrs-full_Revenue
    # 총액 수익 라벨만 매출로 본다. 제품매출·상품매출 등 구성요소 라벨은 이중계상 방지를 위해 제외한다.
    aliases: [매출, 매출액, 수익, 수익(매출액), 영업수익, 영업수익(매출액), 재화의 판매로 인한 수익(매출액), 방송수익]
  매출원가:
    statement: IS
    account_ids:
      - ifrs-full_CostOfSales
    aliases: [매출원가]
  매출총이익:
    statement: IS
    account_ids:
      - ifrs-full_GrossProfit
    aliases: [매출총이익]
  판매비와관리비:
    statement: IS
    account_ids:
      - dart_TotalSellingGeneralAdministrativeExpenses
    aliases: [판매비와관리비]
  영업이익:
    statement: IS
    account_ids:
      - dart_OperatingIncomeLoss
      - ifrs-full_ProfitLossFromOperatingActivities
    aliases: [영업이익]
  이자비용:
    statement: IS
    account_ids:
      - ifrs-full_FinanceCosts
    aliases: [금융비용, 이자비용]
  금융수익:
    statement: IS
    account_ids:
      - ifrs-full_FinanceIncome
    aliases: [금융수익]
  기타수익:
    statement: IS
    account_ids:
      - dart_OtherGains
    aliases: [기타수익]
  기타비용:
    statement: IS
    account_ids:
      - dart_OtherLosses
    aliases: [기타비용]
  법인세비용차감전순이익:
    statement: IS
    account_ids:
      - ifrs-full_ProfitLossBeforeTax
    aliases: [법인세비용차감전순이익, 법인세비용차감전순이익(손실)]
  법인세비용:
    statement: IS
    account_ids:
      - ifrs-full_IncomeTaxExpenseContinuingOperations
    aliases: [법인세비용, 법인세비용(수익)]
  당기순이익:
    statement: IS
    account_ids:
      - ifrs-full_ProfitLoss
    aliases: [당기순이익]
  지배기업귀속순이익:
    statement: IS
    account_ids:
      - ifrs-full_ProfitLossAttributableToOwnersOfParent
    aliases: [지배기업의 소유주에게 귀속되는 당기순이익, 지배기업 소유지분]
  비지배지분순이익:
    statement: IS
    account_ids:
      - ifrs-full_ProfitLossAttributableToNoncontrollingInterests
    aliases: [비지배지분에 귀속되는 당기순이익, 비지배지분]
  기본주당이익:
    statement: IS
    account_ids:
      - ifrs-full_BasicEarningsLossPerShare
    aliases: [기본주당이익, 기본주당이익(손실)]
  희석주당이익:
    statement: IS
    account_ids:
      - ifrs-full_DilutedEarningsLossPerShare
    aliases: [희석주당이익, 희석주당이익(손실)]
  지분법이익:
    statement: IS
    account_ids:
      - ifrs-full_ShareOfProfitLossOfAssociatesAndJointVenturesAccountedForUsingEquityMethod
    aliases: [지분법이익]
  영업활동현금흐름:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsFromUsedInOperatingActivities
    aliases: [영업활동현금흐름, 영업활동 현금흐름]
  영업창출현금흐름:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsFromUsedInOperations
    aliases: [영업에서 창출된 현금흐름]
  운전자본변동:
    statement: CF
    account_ids:
      - dart_AdjustmentsForAssetsLiabilitiesOfOperatingActivities
    aliases: [영업활동으로 인한 자산부채의 변동]
  투자활동현금흐름:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsFromUsedInInvestingActivities
    aliases: [투자활동현금흐름, 투자활동 현금흐름]
  재무활동현금흐름:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsFromUsedInFinancingActivities
    aliases: [재무활동현금흐름, 재무활동 현금흐름]
  유형자산취득:
    statement: CF
    account_ids:
      - ifrs-full_PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities
    aliases: [유형자산의 취득]
  유형자산처분:
    statement: CF
    account_ids:
      - ifrs-full_ProceedsFromSalesOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities
    aliases: [유형자산의 처분]
  무형자산취득:
    statement: CF
    account_ids:
      - ifrs-full_PurchaseOfIntangibleAssetsClassifiedAsInvestingActivities
    aliases: [무형자산의 취득]
  사업결합순현금유출:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsUsedInObtainingControlOfSubsidiariesOrOtherBusinessesClassifiedAsInvestingActivities
    aliases: [사업결합으로 인한 순현금유출액]
  장기차입금차입:
    statement: CF
    account_ids:
      - dart_ProceedsFromLongTermBorrowings
    aliases: [장기차입금의 차입, 장기차입금의 차입 (주27)]
  단기차입금순증감:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsFromUsedInIncreaseDecreaseInCurrentBorrowings
    aliases: [단기차입금의 순증가(감소), 단기차입금의 순증가(감소) (주27)]
  비유동차입금차입:
    statement: CF
    account_ids:
      - ifrs-full_ProceedsFromNoncurrentBorrowings
    aliases: [사채 및 장기차입금의 차입]
  비유동차입금상환:
    statement: CF
    account_ids:
      - dart_RepaymentsOfLongTermBorrowings
      - ifrs-full_RepaymentsOfNoncurrentBorrowings
    aliases: [사채 및 장기차입금의 상환, 사채 및 장기차입금의 상환 (주27)]
  배당금지급:
    statement: CF
    account_ids:
      - ifrs-full_DividendsPaidClassifiedAsFinancingActivities
    aliases: [배당금의 지급, 배당금의지급]
  자기주식취득:
    statement: CF
    account_ids:
      - dart_AcquisitionOfTreasuryShares
    aliases: [자기주식의 취득]
  이자지급:
    statement: CF
    account_ids:
      - ifrs-full_InterestPaidClassifiedAsOperatingActivities
    aliases: [이자의 지급]
  이자수취:
    statement: CF
    account_ids:
      - ifrs-full_InterestReceivedClassifiedAsOperatingActivities
    aliases: [이자의 수취]
  법인세납부:
    statement: CF
    account_ids:
      - ifrs-full_IncomeTaxesPaidRefundClassifiedAsOperatingActivities
    aliases: [법인세 납부액]
