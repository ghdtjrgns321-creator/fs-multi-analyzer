      - ifrs-full_NoncurrentFinancialAssetsMeasuredAtFairValueThroughProfitOrLoss
    aliases: [비유동 당기손익-공정가치 측정 금융자산, 비유동당기손익-공정가치측정금융자산, 비유동당기손익공정가치측정금융자산]
  FVOCI금융자산:
