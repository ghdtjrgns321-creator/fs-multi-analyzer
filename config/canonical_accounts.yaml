    aliases: [확정급여부채, 확정급여채무]
  FVPL금융자산:
    statement: BS
    account_ids:
      - ifrs-full_FinancialAssetsMeasuredAtFairValueThroughProfitOrLoss
    aliases: [당기손익-공정가치 측정 금융자산, 당기손익-공정가치측정금융자산, 당기손익공정가치측정금융자산, 당기손익인식금융자산]
