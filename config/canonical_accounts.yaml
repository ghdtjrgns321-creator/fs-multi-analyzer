# L1 canonical account mapping.
# 1순위: account_id 표준 ID(ifrs-full_*, dart_*). 2순위: aliases.
# Python 코드에 계정 코드·라벨을 하드코딩하지 않는다.

canonical_accounts:
  현금및현금성자산:
    statement: BS
    account_ids:
      - ifrs-full_CashAndCashEquivalents
    aliases: [현금및현금성자산]
  단기금융상품:
    statement: BS
    account_ids:
      - dart_ShortTermDepositsNotClassifiedAsCashEquivalents
      - ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents
    aliases: [단기금융상품]
  매출채권:
    statement: BS
    account_ids:
      - dart_ShortTermTradeReceivable
      - ifrs-full_CurrentTradeReceivables
    aliases: [매출채권]
  재고자산:
    statement: BS
    account_ids:
      - ifrs-full_Inventories
    aliases: [재고자산]
  유동자산:
    statement: BS
    account_ids:
      - ifrs-full_CurrentAssets
    aliases: [유동자산, 유동자산계]
  자산총계:
    statement: BS
    account_ids:
      - ifrs-full_Assets
    aliases: [자산총계]
  유동부채:
    statement: BS
    account_ids:
      - ifrs-full_CurrentLiabilities
    aliases: [유동부채, 유동부채계]
  부채총계:
    statement: BS
    account_ids:
      - ifrs-full_Liabilities
    aliases: [부채총계]
  자본총계:
    statement: BS
    account_ids:
      - ifrs-full_Equity
    aliases: [자본총계]
  매입채무:
    statement: BS
    account_ids:
      - ifrs-full_TradeAndOtherCurrentPayablesToTradeSuppliers
    aliases: [매입채무]
  단기차입금:
    statement: BS
    account_ids:
      - ifrs-full_ShorttermBorrowings
    aliases: [단기차입금, 단기차입부채]
  장기차입금:
    statement: BS
    account_ids:
      - dart_LongTermBorrowingsGross
      - ifrs-full_NoncurrentPortionOfNoncurrentLoansReceived
    aliases: [장기차입금]
  사채:
    statement: BS
    account_ids:
      - dart_BondsIssued
      - ifrs-full_NoncurrentPortionOfNoncurrentBondsIssued
    aliases: [사채]
  충당부채:
    statement: BS
    account_ids:
      - ifrs-full_CurrentProvisions
      - ifrs-full_OtherShorttermProvisions
    aliases: [충당부채]
  장기충당부채:
    statement: BS
    account_ids:
      - ifrs-full_NoncurrentProvisions
      - ifrs-full_OtherLongtermProvisions
    aliases: [장기충당부채]
  유형자산:
    statement: BS
    account_ids:
      - ifrs-full_PropertyPlantAndEquipment
    aliases: [유형자산]
  자본금:
    statement: BS
    account_ids:
      - ifrs-full_IssuedCapital
    aliases: [자본금]
  매출:
    statement: IS
    account_ids:
      - ifrs-full_Revenue
    aliases: [매출, 매출액, 수익(매출액), 영업수익]
  매출원가:
    statement: IS
    account_ids:
      - ifrs-full_CostOfSales
    aliases: [매출원가]
  영업이익:
    statement: IS
    account_ids:
      - dart_OperatingIncomeLoss
      - ifrs-full_ProfitLossFromOperatingActivities
    aliases: [영업이익]
  이자비용:
    statement: IS
    account_ids:
      - ifrs-full_FinanceCosts
    aliases: [금융비용, 이자비용]
  당기순이익:
    statement: IS
    account_ids:
      - ifrs-full_ProfitLoss
    aliases: [당기순이익]
  기본주당이익:
    statement: IS
    account_ids:
      - ifrs-full_BasicEarningsLossPerShare
    aliases: [기본주당이익, 기본주당이익(손실)]
  영업활동현금흐름:
    statement: CF
    account_ids:
      - ifrs-full_CashFlowsFromUsedInOperatingActivities
    aliases: [영업활동현금흐름, 영업활동 현금흐름]
