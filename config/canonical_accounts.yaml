    aliases: [자본총계, 기말자본]
  지배기업소유주지분:
    statement: BS
    account_ids:
      - ifrs-full_EquityAttributableToOwnersOfParent
    aliases: [지배기업 소유주지분, 지배기업 소유지분]
  비지배지분:
    statement: BS
    account_ids:
      - ifrs-full_NoncontrollingInterests
    aliases: [비지배지분]
  비유동자산:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_NoncurrentAssets
    aliases: [비유동자산]
  # 금융지주·복합기업 2부문 BS: 자산총계 = 유동+비유동(비금융업) + 금융업자산. 표준코드 미사용(placeholder)
  # 라벨로만 신고되어 미분류(기타)로 빠지면 항등식이 금융업 규모만큼 깨진다. 섹션 집계라 is_subtotal.
  금융업자산:
    statement: BS
    is_subtotal: true
    account_ids: []
    aliases: [금융업자산]
  금융업부채:
    statement: BS
