# === D-D: SCE(자본변동표) 2D 구성요소(열) 표준화 ===
# 자본변동표는 (변동행 x 자본구성요소) 2차원 표다. account_detail 경로의 leaf(마지막
# 세그먼트)가 실제 귀속 구성요소다. leaf raw 라벨은 별도 보존(component_raw)하고, 아래
# 표준으로 묶어 회사 간 비교를 가능케 한다(component_std). role로 leaf/소계/총계를 구분해
# 합계검증(지배지분+비지배=자본총계)도 가능하게 둔다.
#   role: leaf(실 구성요소) / subtotal(소계축) / total(자본총계) / composite(미분리 합산열)
# 적립금류는 명칭 성격대로 배정: 준비금·법정적립금→이익잉여금, 보상·재평가·환산→자본조정/OCI.
sce_equity_components:
  자본금:
    role: leaf
    aliases: [자본금, 보통주, 우선주]
  주식발행초과금:
    role: leaf
    aliases: [주식발행초과금, 주식발행초과금 등]
  자본잉여금:
    role: leaf
    aliases: [자본잉여금, 기타자본잉여금, 연결자본잉여금, 자본적립금, 감자차익(차손), 자기주식처분이익, 합병차익]
  이익잉여금:
    role: leaf
    aliases: [이익잉여금, 미처분이익잉여금(미처리결손금), 연결이익잉여금, 이익준비금, 법정적립금, 적립금, 기타적립금, 그밖의 기타 적립금]
  자본조정:
    role: leaf
    aliases: [자본조정, 연결자본조정, 기타자본조정, 주식선택권, 주식매수선택권, 주식기준보상 적립금, 존속하는 주식선택권의 행사가격 범위]
  자기주식:
    role: leaf
    aliases: [자기주식]
  신종자본증권:
    role: leaf
    aliases: [신종자본증권]
  추가납입자본:
    role: leaf
    aliases: [추가납입자본, 기타불입자본, 그외 기타불입자본, 기타의 기타불입자본, 납입자본]
  기타포괄손익누계액:
    role: leaf
    aliases: [기타포괄손익누계액, 기타포괄손익누적액, 연결기타포괄손익누계액, 재평가잉여금, 환산 관련 외환차이 적립금, 외화환산차이 적립금, 현금흐름위험회피 적립금, 금융자산공정가치평가 적립금, 기타포괄손익인식금융자산 평가손익 적립금, 지분상품에 대한 투자자산으로 인한 손익 적립금, 지분법자본변동]
  기타자본구성요소:
    role: leaf
    aliases: [기타자본구성요소, 기타자본, 기타자본항목, 기타지분, 기타의 자본항목, 기타]
  지배기업소유주지분:
    role: subtotal
    aliases: [지배기업의 소유주에게 귀속되는 지분, 지배기업의 소유주에게 귀속되는 자본, 지배기업 소유주 지분, 지배기업 소유주에게 귀속되는 자본, 지배기업 소유주 귀속분, 지배기업, 소유주 귀속]
  비지배지분:
    role: leaf
    aliases: [비지배지분, 비연결구조화기업]
  자본총계:
    role: total
    aliases: [자본]
  # 미분리(합산) 열은 억지로 쪼개지 않고 composite로 격리. component_raw에 원형 보존.
  복합_자본잉여금_자본조정:
    role: composite
    aliases: [자본잉여금과 자본조정]
  복합_자본잉여금_기타자본:
    role: composite
    aliases: [자본잉여금 및 기타자본구성요소]
  복합_기타포괄손익_자본조정:
    role: composite
    aliases: [기타포괄손익누계액과 자본조정]
  복합_기타자본_기타포괄손익:
    role: composite
    aliases: [기타자본 및 기타포괄손익누계액]
  복합_지분법적용투자지분:
    role: composite
    aliases: [지분법적용 투자지분]
  복합_미사용세무결손금:
    role: composite
    aliases: [미사용 세무상 결손금]

# 표 전체 총계 마커(구성요소 아님). account_detail이 이 라벨 단독이면 표 합계 행.
sce_fs_total_markers: [연결재무제표, 별도재무제표]

# SCE 차감변동: 자본을 감소시키는데 raw XBRL은 양수(크기)로 신고하는 변동.
# 이 change_canonical에 해당하면 amount 부호를 음수로 정규화해야 "기초+Σ변동=기말" 검산이 맞는다.
# 가산변동(당기순이익·유상증자·주식발행 등)은 양수 그대로 둔다.
# 신종자본증권 상환/배당/이자·배당금지급 변형은 N2/N3(라운드1): 같은 차감 실질이 회사/연도마다
# 다른 canonical(또는 raw 부호)로 갈라져 검산이 비결정이던 것을 -abs로 결정화. 발행(가산)은 제외.
sce_deduction_changes: [배당변동, 배당금의 지급, 배당금의 지급(SCE), 배당금지급, 자기주식취득, 유상감자, 무상감자, 주식할인발행차금, 중간배당, 신종자본증권배당, 신종자본증권의 배당, 신종자본증권상환, 신종자본증권의 상환, 신종자본증권 이자, 신종자본증권 이자지급, 비지배지분에 대한 배당금]

# SCE 차감변동 account_id 보강: 같은 차감 실질이 label/canonical 변형으로 갈라져도 표준 id로 -abs.
sce_deduction_ids:
  - dart_AnnualDividendsPaid
  - ifrs-full_DividendsPaid
  - ifrs_DividendsPaid
  - ifrs-full_DividendsPaidOrdinaryShares
  - ifrs_DividendsPaidOrdinaryShares
  - ifrs-full_DividendsPaidToEquityHoldersOfParentClassifiedAsFinancingActivities
  - ifrs_DividendsPaidToEquityHoldersOfParentClassifiedAsFinancingActivities
  - ifrs-full_DividendsPaidToNoncontrollingInterests
  - ifrs_DividendsPaidToNoncontrollingInterests
  - ifrs-full_DividendsRecognisedAsDistributionsToNoncontrollingInterests

# SCE 변동행 role 표준화(N1/D5 라운드1): 검산(기초+Σ변동=기말)은 leaf만 합산한다.
# 소계(총포괄손익=NI+OCI, 기타포괄손익=OCI leaf 합, 자본증감합계)와 조정후 개시(스톡)를 변동으로
# 합산하면 이중계상이라 검산이 깨진다(00120526/2024 13.5조 오차 등). canonical로 begin/total/소계를
# 식별하고, 조정후개시는 label에 marker 포함 & canonical≠기초자본일 때로 식별(코드 하드코딩 아님).
sce_change_roles:
  begin: [기초자본]            # 개시 자본(기말 검산 시작점)
  total: [자본총계]            # 기말 자본(검산 도착점)
  # leaf의 합(소계) — 변동 합산서 제외. R1(라운드2): '소유주와의 거래 합계' canonical 추가.
  subtotal: [총포괄손익, 기타포괄손익, 자본증감합계, 소유주와의 거래 합계]
  subtotal_children:
    기타포괄손익:
      - 확정급여재측정손익
      - FVOCI지분상품평가손익
      - FVOCI적립금변동
      - 해외사업환산손익
      - 환율변동효과
      - 현금흐름위험회피손익
      - 자산재평가손익
      - 지분법기타포괄손익재분류가능
      - 지분법기타포괄손익재분류불가능
      - 기타포괄손익(SCE)
      - 해외사업환산손익(SCE)
      - 지분법자본변동(SCE)
  # R1(라운드2): 소계 label 변형 흡수. label에 이 marker 포함이면 canonical 미등록이라도 소계로
  # 분류('자본에 직접 반영된 소유주와의 거래 등' 등). 일반 leaf('소유주에 대한 배분으로 인식된
  # 배당금'='소유주와의 거래' 미포함)는 영향 없음.
  subtotal_label_markers: [소유주와의 거래]
  # 개시 reconciliation 행(canonical begin이 아닌 개시 스톡·재작성 브릿지) — 기간 변동이 아니라
  # 검산서 제외. label에 marker 포함 & canonical≠begin이면 제외. 기초자본:조정후/회계정책변경후
  # 기초자본, 기초보고금액:전기보고 개시 스톡, 재작성:재무제표 재작성 브릿지(00413046/2018).
  # 회계정책변경효과(기간 효과 leaf)는 marker 미포함이라 영향 없음.
  restated_begin_markers: [기초자본, 기초보고금액, 재작성, 반영후자본]
  # restated_begin으로 분류되지만 스톡 잔액이 아니라 기초에 더해야 하는 재작성 델타형.
  restated_delta_label_markers: [재작성효과]
  # bare 합계열에서 "기초+이전 leaf 변동"과 금액이 같으면 기간 변동이 아니라 스톡 잔액행으로 격리.
  stock_balance_label_markers: [소계, 잔액, 수정후금액, 조정후금액, 반영후자본, 기초보고금액]
  # 변동 leaf끼리 부모=자식합 벡터가 일치할 때 부모 subtotal 후보를 고르는 보조 label marker.
  parent_subtotal_label_markers: [관련손익, 합계, 소계]

# R2(라운드2): 통합 canonical(취득·처분 양방향 alias)은 무조건 -abs 불가 — label 의미로 부호 분기.
# 취득·소각·감자는 자본 차감(-abs), 처분·발행·재발행은 자본 가산(+abs). 분기 키워드는 config 데이터.
# 단일방향 차감(배당 등)은 sce_deduction_changes(항상 -abs)에 둔다.
sce_combined_deductions:
  자기주식변동:
    minus: [취득, 소각, 감자]
    plus: [처분, 발행, 재발행, 매각]
