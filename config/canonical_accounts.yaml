# L1 canonical account mapping.
# 1순위: account_id 표준 ID(ifrs-full_*, dart_*). 2순위: aliases.
# Python 코드에 계정 코드·라벨을 하드코딩하지 않는다.

canonical_accounts:
  현금및현금성자산:
    statement: BS
    account_ids:
      - ifrs-full_CashAndCashEquivalents
    aliases: [현금및현금성자산]
  단기금융상품:
    statement: BS
    account_ids:
      - dart_ShortTermDepositsNotClassifiedAsCashEquivalents
      - ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents
    aliases: [단기금융상품]
  매출채권:
    statement: BS
    account_ids:
      - dart_ShortTermTradeReceivable
      - ifrs-full_CurrentTradeReceivables
    # 순수 매출채권만. "매출채권 및 기타채권" 통합은 별도 canonical(소실·덮어쓰기 방지).
    aliases: [매출채권]
  매출채권및기타유동채권:
    statement: BS
    account_ids:
      - ifrs-full_TradeAndOtherCurrentReceivables
      - ifrs_TradeAndOtherCurrentReceivables
    aliases: [매출채권 및 기타유동채권, 매출채권 및 기타채권, 매출채권및기타채권]
  비유동매출채권:
    statement: BS
    account_ids:
      - ifrs-full_NoncurrentTradeReceivables
      - dart_LongTermTradeReceivablesGross
      - dart_LongTermTradeAndOtherNonCurrentReceivablesGross
      - ifrs-full_NoncurrentReceivables
    aliases: [장기매출채권, 비유동매출채권]
  계약자산:
    statement: BS
    account_ids:
      - ifrs-full_ContractAssets
      - ifrs-full_CurrentContractAssets
      - dart_ShortTermDueFromCustomersForContractWork
    # K-IFRS 1115 진행률/수주 유동 계약자산. 비유동은 별도 canonical로 분리.
    aliases: [계약자산, 유동계약자산, 미청구공사, 단기미청구공사, 미청구공사채권, 확정계약자산, 유동확정계약자산]
  비유동계약자산:
    statement: BS
    account_ids:
      - ifrs-full_NoncurrentContractAssets
      - dart_LongTermDueFromCustomersForContractWork
    aliases: [비유동계약자산]
  재고자산:
    statement: BS
    account_ids:
      - ifrs-full_Inventories
    aliases: [재고자산]
  미수금:
    statement: BS
    account_ids:
      - dart_ShortTermOtherReceivables
      - dart_ShortTermOtherReceivablesNet
    aliases: [미수금]
  선급비용:
    statement: BS
    account_ids:
      - dart_ShortTermPrepaidExpenses
      - ifrs-full_CurrentPrepaidExpenses
    aliases: [선급비용]
  기타유동자산:
    statement: BS
    account_ids:
      - ifrs-full_OtherCurrentAssets
      - dart_OtherCurrentAssets
    aliases: [기타유동자산]
  유동자산:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_CurrentAssets
    aliases: [유동자산, 유동자산계]
  자산총계:
    statement: BS
    is_subtotal: true
    account_ids:
      - ifrs-full_Assets
    aliases: [자산총계]
  자본과부채총계:
