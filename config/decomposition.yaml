# 변동 분해 항등식 (PLAN §6.5) — K-IFRS 표준 소계 브리지만. 계정 트리 전수 정의 아님.
# 각 bridge: variants(구성 슬롯 목록). 슬롯 = accounts(동의 canonical 후보 — 표준코드 계열에
# 따라 같은 실질이 다른 canonical로 갈라진 것 흡수, 예: 판매비와관리비[dart]/판매 및
# 일반관리비[ifrs]) + sign + label(표시명). 회사별로 |잔차| 최소 variant를 데이터로 선택.
#
# 실측 근거(2026-07, 4,782 corp-year 전수): GP 잔차≤1% 99.98% · OP 표준형 92.1% ·
# OP 기타포함형 9.9%(변형 선택 필요근거). 세전 변형선택 2,880/4,547(63.3%) ·
# 순이익 1,729/2,017(85.7%) — 미달 회사는 '분해 불충분' 잔차 경고로 정직 표시.
decomposition_bridges:
  매출총이익:
    variants:
      - name: 표준
        components:
          - label: 매출
            sign: 1
            accounts: [매출]
          - label: 매출원가
            sign: -1
            accounts: [매출원가]
  영업이익:
    variants:
      - name: 표준
        components:
          - label: 매출총이익
            sign: 1
            accounts: [매출총이익]
          - label: 판매비와관리비
            sign: -1
            accounts: [판매비와관리비, 판매 및 일반관리비]
      - name: 기타포함
        components:
          - label: 매출총이익
            sign: 1
            accounts: [매출총이익]
          - label: 판매비와관리비
            sign: -1
            accounts: [판매비와관리비, 판매 및 일반관리비]
          - label: 기타수익
            sign: 1
            accounts: [기타수익]
          - label: 기타비용
            sign: -1
            accounts: [기타비용]
  법인세비용차감전순이익:
    variants:
      - name: 금융만
        components:
          - label: 영업이익
            sign: 1
            accounts: [영업이익]
          - label: 금융수익
            sign: 1
            accounts: [금융수익]
          - label: 금융비용
            sign: -1
            accounts: [이자비용]
      - name: 금융·기타
        components:
          - label: 영업이익
            sign: 1
            accounts: [영업이익]
          - label: 금융수익
            sign: 1
            accounts: [금융수익]
          - label: 금융비용
            sign: -1
            accounts: [이자비용]
          - label: 기타수익
            sign: 1
            accounts: [기타수익]
          - label: 기타비용
            sign: -1
            accounts: [기타비용]
      - name: 금융·기타·지분법
        components:
          - label: 영업이익
            sign: 1
            accounts: [영업이익]
          - label: 금융수익
            sign: 1
            accounts: [금융수익]
          - label: 금융비용
            sign: -1
            accounts: [이자비용]
          - label: 기타수익
            sign: 1
            accounts: [기타수익]
          - label: 기타비용
            sign: -1
            accounts: [기타비용]
          - label: 지분법이익
            sign: 1
            accounts: [지분법이익]
  당기순이익:
    variants:
      - name: 표준
        components:
          - label: 법인세비용차감전순이익
            sign: 1
            accounts: [법인세비용차감전순이익]
          - label: 법인세비용
            sign: -1
            accounts: [법인세비용]
  # CF 브리지 — 이익의 질(순이익이 현금으로 얼마나 오나)을 기여로 쪼갠다.
  # 손익 브리지와 달리 부호 규약이 회사마다 갈린다(이자지급·법인세납부를 음수로 내는 회사와
  # 절대값으로 내는 회사). 손으로 정하지 않고 유출표기 variant를 둘 다 두어 |잔차| 최소로 고른다.
  # 같은 소계가 회사마다 '영업창출현금흐름'(54사)·'영업에서 창출된 현금'(13사)으로 갈린다
  # — 실측(표본 200사) 기준 동의 슬롯으로 흡수한다.
  영업창출현금흐름:
    variants:
      - name: 표준
        components:
          - label: 당기순이익
            sign: 1
            accounts: [당기순이익]
          - label: 비현금조정
            sign: 1
            accounts: [당기순이익조정가감]
          - label: 운전자본변동
            sign: 1
            accounts: [운전자본변동]
  영업활동현금흐름:
    variants:
      - name: 유출음수표기
        components:
          - label: 영업창출현금흐름
            sign: 1
            accounts: [영업창출현금흐름, 영업에서 창출된 현금, 영업으로부터 창출된 현금]
          - label: 이자수취
            sign: 1
            accounts: [이자수취]
          - label: 이자지급
            sign: 1
            accounts: [이자지급]
          - label: 법인세납부
            sign: 1
            accounts: [법인세납부]
      - name: 유출양수표기
        components:
          - label: 영업창출현금흐름
            sign: 1
            accounts: [영업창출현금흐름, 영업에서 창출된 현금, 영업으로부터 창출된 현금]
          - label: 이자수취
            sign: 1
            accounts: [이자수취]
          - label: 이자지급
            sign: -1
            accounts: [이자지급]
          - label: 법인세납부
            sign: -1
            accounts: [법인세납부]
      - name: 배당포함·유출음수표기
        components:
          - label: 영업창출현금흐름
            sign: 1
            accounts: [영업창출현금흐름, 영업에서 창출된 현금, 영업으로부터 창출된 현금]
          - label: 이자수취
            sign: 1
            accounts: [이자수취]
          - label: 배당금수취
            sign: 1
            accounts: [배당금수취]
          - label: 이자지급
            sign: 1
            accounts: [이자지급]
          - label: 법인세납부
            sign: 1
            accounts: [법인세납부]
      - name: 배당포함·유출양수표기
        components:
          - label: 영업창출현금흐름
            sign: 1
            accounts: [영업창출현금흐름, 영업에서 창출된 현금, 영업으로부터 창출된 현금]
          - label: 이자수취
            sign: 1
            accounts: [이자수취]
          - label: 배당금수취
            sign: 1
            accounts: [배당금수취]
          - label: 이자지급
            sign: -1
            accounts: [이자지급]
          - label: 법인세납부
            sign: -1
            accounts: [법인세납부]
      - name: 영업창출없음
        components:
          - label: 당기순이익
            sign: 1
            accounts: [당기순이익]
          - label: 비현금조정
            sign: 1
            accounts: [당기순이익조정가감]
          - label: 운전자본변동
            sign: 1
            accounts: [운전자본변동]
