# 계정 관계 사슬 (PLAN §6.2). 신호엔진이 사슬을 따라 정합성을 점검한다.
# pairwise 비교를 넘어 "사슬 추적"이 핵심. 계정명은 canonical_accounts.yaml 기준.

relationship_chains:
  - id: revenue-receivable-cf
    name: 수익의 질·회수가능성
    chain: [매출, 매출채권, 대손충당금, 영업활동현금흐름]
    audit_basis:
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 매출, 매출채권, 대손충당금, 영업활동현금흐름 간 관계를 분석적 절차로 검토한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: ISA/KSA 540
        procedure: accounting_estimates_and_disclosures
        gist: 대손충당금과 관련 주석을 회계추정 및 공시 검토 관점으로 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1109 / IFRS 9
        procedure: financial_instruments_impairment
        gist: 매출채권 손상과 기대신용손실 관련 숫자·주석을 교차검증한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/
      - standard: K-IFRS 1107 / IFRS 7
        procedure: financial_instruments_disclosures
        gist: 신용위험과 금융상품 공시를 매출채권 신호의 주석 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-7-financial-instruments-disclosures/
      - standard: K-IFRS 1115 / IFRS 15
        procedure: revenue_recognition_disclosures
        gist: 매출 인식과 수취채권 관련 공시를 매출-채권 관계 검토에 연결한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers/
  - id: inventory-cogs
    name: 재고 진부화·원가
    chain: [재고자산, 매출원가, 재고평가손실]
    audit_basis:
      - standard: ISA/KSA 501
        procedure: selected_items_inventory
        gist: 재고자산은 특정 항목 감사증거 검토 대상으로 별도 주의가 필요하다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 재고자산, 매출원가, 재고평가손실 간 관계를 분석적 절차로 검토한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: ISA/KSA 540
        procedure: accounting_estimates_and_disclosures
        gist: 재고평가손실과 순실현가능가치 판단을 회계추정 및 공시 검토 관점으로 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1002 / IAS 2
        procedure: inventories_measurement_disclosure
        gist: 재고자산 측정, 비용 인식, 평가손실 주석을 숫자 신호와 교차검증한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/
      - standard: K-IFRS 1036 / IAS 36
        procedure: impairment_review
        gist: 재고 외 자산 손상 신호와 손상 공시 확장 검토의 보조 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/
  - id: revenue-contract-progress
    name: 진행률 수익·계약자산
    chain: [매출, 계약자산, 계약부채, 공사손실충당부채]
    audit_basis:
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 매출과 계약자산 증가율 괴리를 분석적 절차로 검토한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1115 / IFRS 15
        procedure: revenue_recognition_contract_balances
        gist: 계약자산·계약부채와 수익 인식의 관계를 진행률 수익 검토 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers/
  - id: debt-interest-cf
    name: 유동성·계속기업
    chain: [단기차입금, 장기차입금, 사채, 이자비용, 재무활동현금흐름, 차입금만기주석]
    audit_basis:
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 차입금, 이자비용, 현금흐름 간 관계를 분석적 절차로 검토한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: ISA/KSA 570
        procedure: going_concern_review
        gist: 유동성 압박과 계속기업 관련 주석을 검토 후보로 연결한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1007 / IAS 7
        procedure: cash_flow_statement_review
        gist: 현금흐름표의 영업·재무 현금흐름을 차입금 신호와 함께 본다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/
      - standard: K-IFRS 1107 / IFRS 7
        procedure: liquidity_risk_disclosures
        gist: 유동성위험과 만기 분석 공시를 차입금 신호의 주석 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-7-financial-instruments-disclosures/
  - id: operating-profit-net-income
    name: 영업손익에서 순이익으로
    chain: [영업이익, 금융수익, 이자비용, 기타수익, 기타비용, 법인세비용, 당기순이익]
    audit_basis:
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 영업이익과 순이익의 차이를 영업외손익·세금으로 설명한다.
        source_url: https://www.iaasb.org/standards-pronouncements
  - id: debt-funding-use
    name: 차입금 조달과 사용처
    chain: [장기차입금, 단기차입금, 재무활동현금흐름, 투자활동현금흐름, 유형자산취득, 사업결합순현금유출]
    audit_basis:
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 차입금 증가가 재무활동CF와 투자활동CF·설비투자로 연결되는지 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1007 / IAS 7
        procedure: cash_flow_statement_review
        gist: 투자·재무 현금흐름의 주요 하위 항목으로 자금 조달과 사용처를 확인한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/
  - id: earnings-cash-working-capital
    name: 순이익·영업CF·운전자본
    chain: [당기순이익, 영업창출현금흐름, 영업활동현금흐름, 운전자본변동, 매출채권, 재고자산, 매입채무]
    audit_basis:
      - standard: ISA/KSA 520
        procedure: analytical_procedures
        gist: 순이익과 영업CF 차이를 운전자본 변동과 조정 항목으로 검토한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1007 / IAS 7
        procedure: cash_flow_statement_review
        gist: 영업활동 현금흐름과 운전자본 변동을 이익의 질 검토 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/
  - id: provision-contingency-note
    name: 충당부채·우발부채 교차
    chain: [충당부채, 장기충당부채, 우발부채주석]
    audit_basis:
      - standard: ISA/KSA 501
        procedure: litigation_claims_review
        gist: 소송·청구 관련 증거와 주석을 특정 항목 검토 대상으로 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: ISA/KSA 540
        procedure: accounting_estimates_and_disclosures
        gist: 충당부채 측정과 관련 공시를 회계추정 검토 관점으로 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1037 / IAS 37
        procedure: provisions_contingencies_disclosure
        gist: 충당부채·우발부채 인식과 공시를 수치와 텍스트로 교차검증한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/
  - id: cash-existence
    name: 현금·금융자산 실재성
    # 이자수익은 10사뿐 — 금융수익(171사)이 실측 커버리지가 넓다.
    chain: [현금및현금성자산, 단기금융상품, 금융수익]
    audit_basis:
      - standard: ISA/KSA 500
        procedure: evidence_grounding
        gist: 현금·금융자산 잔액과 그로부터 발생해야 할 금융수익을 함께 근거로 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: ISA/KSA 505
        procedure: external_confirmations
        gist: 잔액 실재성은 외부조회 대상이므로 검토 후보로 표시한다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1107 / IFRS 7
        procedure: financial_instruments_disclosures
        gist: 사용제한 예금 등 금융상품 공시를 잔액 신호의 주석 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-7-financial-instruments-disclosures/
  - id: related-party-lending
    name: 특수관계자 자금 유출
    chain: [장기대여금증가, 투자활동현금흐름, 관계기업투자]
    audit_basis:
      - standard: ISA/KSA 550
        procedure: related_party_review
        gist: 특수관계자 거래와 관련 주석을 별도 검토 대상으로 본다.
        source_url: https://www.iaasb.org/standards-pronouncements
      - standard: K-IFRS 1024 / IAS 24
        procedure: related_party_disclosures
        gist: 특수관계자 공시를 대여금·지분투자 자금 유출 신호의 주석 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ias-24-related-party-disclosures/
  - id: consolidation-structure
    name: 연결 구조·비지배지분
    chain: [지배기업소유주지분, 비지배지분, 지배기업귀속순이익, 비지배지분순이익, 종속기업투자, 관계기업투자, 지분법이익]
    audit_basis:
      - standard: K-IFRS 1110 / IFRS 10
        procedure: consolidated_financial_statement_review
        gist: 연결재무제표 작성과 내부거래 제거 원칙을 CFS/OFS 괴리 검토의 회계 근거로 사용한다.
        source_url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-10-consolidated-financial-statements/
      - standard: ISA/KSA 600
        procedure: group_audit_context
        gist: 그룹 재무정보 통합과 구성단위 관련 검토 맥락을 연결 특유 신호의 보조 근거로 사용한다.
        source_url: https://www.iaasb.org/standards-pronouncements

audit_basis:
  common_review:
    - standard: ISA/KSA 315
      procedure: risk_identification_from_fs_and_notes
      gist: 공시 재무제표와 주석의 관계를 이용해 중요왜곡표시 위험 후보를 식별한다.
      source_url: https://www.iaasb.org/standards-pronouncements
    - standard: ISA/KSA 500
      procedure: evidence_grounding
      gist: 숫자 신호와 주석 위치를 충분하고 적합한 근거로 분리 기록한다.
      source_url: https://www.iaasb.org/standards-pronouncements
  materiality:
    - standard: ISA/KSA 320
      procedure: materiality_prioritization
      gist: 임계값과 우선순위는 중요성 관점의 검토 보조 기준으로 사용한다.
      source_url: https://www.iaasb.org/standards-pronouncements
    - standard: ISA/KSA 450
      procedure: misstatement_evaluation
      gist: 누적된 신호를 왜곡표시 평가 관점으로 묶되 확정 판단은 하지 않는다.
      source_url: https://www.iaasb.org/standards-pronouncements
  disclosure_change:
    - standard: ISA/KSA 560
      procedure: subsequent_events_review
      gist: 보고기간후 사건과 관련 주석 변동을 별도 공시 변동 신호로 본다.
      source_url: https://www.iaasb.org/standards-pronouncements
    - standard: ISA/KSA 701
      procedure: key_audit_matter_context
      gist: KAM은 Finding 판단을 바꾸지 않는 참고 맥락과 확인 질문에만 사용한다.
      source_url: https://www.iaasb.org/standards-pronouncements
    - standard: ISA/KSA 710
      procedure: comparative_information_review
      gist: 전기 대비 숫자·주석 비교의 기준으로 사용한다.
      source_url: https://www.iaasb.org/standards-pronouncements

l2_mvp1:
  primary_fs_div: CFS
  reference_fs_div: OFS
  # Deprecated for analysis windows. Signal years are derived from loaded data
  # or passed explicitly by callers.
  years: [2022, 2023, 2024, 2025]
  yoy_accounts:
    - 현금및현금성자산
    - 단기금융상품
    - 미수금
    - 선급비용
    - 매출채권
    - 계약자산
    - 계약부채
    - 재고자산
    - 기타유동자산
    - 관계기업투자
    - 무형자산
    - 무형자산손상차손
    - 영업권
    - 금융수익
    - 장기대여금증가
    - 유동부채
    - 매입채무
    - 단기차입금
    - 장기차입금
    - 사채
    - 충당부채
    - 장기충당부채
    - 공사손실충당부채
    - 유형자산
    - 자본금
    - 지배기업소유주지분
    - 비지배지분
    - 매출
    - 매출원가
    - 매출총이익
    - 판매비와관리비
    - 영업이익
    - 금융수익
    - 이자비용
    - 기타수익
    - 기타비용
    - 법인세비용차감전순이익
    - 법인세비용
    - 당기순이익
    - 지배기업귀속순이익
    - 비지배지분순이익
    - 지분법이익
    - 투자활동현금흐름
    - 재무활동현금흐름
    - 영업활동현금흐름
    - 영업창출현금흐름
    - 운전자본변동
    - 유형자산취득
    - 사업결합순현금유출
    - 장기차입금차입
    - 단기차입금순증감
    - 비유동차입금차입
    - 비유동차입금상환
    - 배당금지급
    - 자기주식취득
  growth_divergences:
    - id: revenue-vs-receivable
      name: 매출 vs 매출채권 증가율 괴리
      account_a: 매출
      account_b: 매출채권
    - id: revenue-vs-inventory
      name: 매출 vs 재고자산 증가율 괴리
      account_a: 매출
      account_b: 재고자산
    - id: revenue-vs-contract-asset
      name: 매출 vs 계약자산 증가율 괴리
      account_a: 매출
      account_b: 계약자산
    - id: cogs-vs-inventory
      name: 매출원가 vs 재고자산 증가율 괴리
      account_a: 매출원가
      account_b: 재고자산
    - id: operating-profit-vs-net-income
      name: 영업이익 vs 당기순이익 증가율 괴리
      account_a: 영업이익
      account_b: 당기순이익
    - id: operating-cf-vs-net-income
      name: 영업활동현금흐름 vs 당기순이익 증가율 괴리
      account_a: 영업활동현금흐름
      account_b: 당기순이익
    - id: financing-cf-vs-long-borrowing
      name: 재무활동CF vs 장기차입금 증가율 괴리
      account_a: 재무활동현금흐름
      account_b: 장기차입금
    - id: investing-cf-vs-capex
      name: 투자활동CF vs 유형자산 취득 증가율 괴리
      account_a: 투자활동현금흐름
      account_b: 유형자산취득
    # 계정 커버리지 실측(표본 200사, 2개 연도 모두 보유 기준)으로 짝을 정했다.
    # 이자수익은 10사뿐이라 금융수익(171사)으로 대체 — 이자·배당·평가익을 합친 상위 계정이라
    # "잔액은 느는데 수익이 안 따라온다"는 실재성 질문은 그대로 성립한다.
    # 넣지 않은 축과 이유(같은 실측):
    #   무형자산↔연구개발비  — 연구개발비 5사(경상개발비도 5사). 개발비 자산화는 본문 합계
    #                          계정으로 측정 불가 → 주석 관점이 서술로 본다.
    #   무형자산↔손상차손    — 짝 보유는 25사지만 실제 산출 2사. 손상차손 금액이 규모 임계
    #                          (max 1억, 자산 1%) 아래라 괴리 신호로는 구조적으로 안 걸린다.
    - id: short-term-investment-vs-financial-income
      name: 단기금융상품 vs 금융수익 증가율 괴리
      account_a: 단기금융상품
      account_b: 금융수익
    - id: cash-vs-financial-income
      name: 현금및현금성자산 vs 금융수익 증가율 괴리
      account_a: 현금및현금성자산
      account_b: 금융수익
  direction_checks:
    - id: receivable-growth-vs-operating-cf
      name: 매출채권 증가율과 영업활동현금흐름 방향 비교
      growth_account: 매출채권
      flow_account: 영업활동현금흐름
    - id: debt-growth-vs-financing-cf
      name: 장기차입금 증가와 재무활동현금흐름 방향 비교
      growth_account: 장기차입금
      flow_account: 재무활동현금흐름
    - id: income-vs-operating-cf
      name: 당기순이익과 영업활동현금흐름 방향 비교
      growth_account: 당기순이익
      flow_account: 영업활동현금흐름
    # 대여금증가(43사)보다 장기대여금증가(63사)가 커버리지가 넓고, 특수관계자 자금 유출은
    # 통상 장기로 잡힌다.
    - id: long-term-lending-vs-investing-cf
      name: 장기대여금 증가와 투자활동현금흐름 방향 비교
      growth_account: 장기대여금증가
      flow_account: 투자활동현금흐름
  deferred_ratios:
    - name: ROI
      reason: 공시 재무제표 기본 합계 계정에 투자원가가 없어 계산하지 않는다.
  signal_thresholds:
    divergence_pp_abs: 15
    yoy_pct_abs: 50
    mix_shift_pp_abs: 5
    z_score_abs: 2
    universal_z_score_cap: 10
    signal_strength_cap: 10
    cfs_ofs_gap_pct_abs: 30
    universal_min_pct_of_assets: 1.0
    universal_min_abs_amount: 100000000
    asset_sanity_jump_multiple: 100
    direction_red_flags:
      - id: revenue-down-receivable-up
        name: 매출 감소 + 매출채권 증가
        account_a: 매출
        direction_a: decrease
        account_b: 매출채권
        direction_b: increase
      - id: receivable-up-operating-cf-down
        name: 매출채권 증가 + 영업활동현금흐름 감소
        account_a: 매출채권
        direction_a: increase
        account_b: 영업활동현금흐름
        direction_b: decrease
