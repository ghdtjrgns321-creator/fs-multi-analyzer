# S10 — event/report 종류 → 분석 관점 라우팅 (데이터 외부화, 전 회사 동일)
#
# "어느 관점이 이 종류를 볼지"를 종류(타입)에 건다. 회사 특성이 아니라 종류에 거는 것이라
# 모든 회사에 동일 적용된다(§3 케이스 하드코딩 아님). "계정은 데이터로 흐른다"와 같은 원칙 —
# event/report 종류도 관점으로 흐른다. 실제 "이 회사에서 의미있나"의 판단은 관점 LLM이 한다.
#
# 관점: flow(자금/차입) · change(구조 변화) · numeric(수준/위기) · note(주석/지배구조).

event_routing:
  # 자본조달·자기주식 — 자금/희석/차입 흐름
  flow:
    - 유상증자
    - 무상증자
    - 유무상증자
    - 감자
    - 전환사채발행
    - 신주인수권부사채발행
    - 교환사채발행
    - 조건부자본증권발행
    - 자기주식취득
    - 자기주식처분
    - 자기주식취득신탁계약체결
    - 자기주식취득신탁계약해지
    - 사채권양수
    - 사채권양도결정
  # 구조조정·지배구조 변화
  change:
    - 회사합병
    - 회사분할
    - 회사분할합병
    - 영업양수
    - 영업양도
    - 자산양수도
    - 타법인증권양수
    - 타법인증권양도
    - 유형자산양수
    - 유형자산양도
    - 주식교환
    - 해외상장
    - 해외상장폐지
    - 해외상장결정
    - 해외상장폐지결정
  # 위기·계속기업 사건
  numeric:
    - 부도발생
    - 영업정지
    - 회생절차
    - 관리절차개시
    - 관리절차중단
    - 해산사유
    - 소송

report_routing:
  # 부채 프로파일·자금조달·자기주식
  flow:
    - 회사채미상환
    - 단기사채미상환
    - 기업어음미상환
    - 신종자본증권미상환
    - 조건부자본증권미상환
    - 채무증권발행
    - 증자
    - 자기주식
    - 공모자금사용
    - 사모자금사용
  # 지배구조 변화·출자
  change:
    - 최대주주
    - 최대주주변동
    - 타법인출자
  # 주석/지배구조 참고(중복성 높음 — 관점 LLM이 필요시 참고)
  note:
    - 배당
    - 소액주주
    - 임원
    - 직원
    - 사외이사
    - 회계감사
    - 감사용역
    - 회계감사용역계약
    - 임원개인보수
    - 개인별보수
    - 임원전체보수
    - 임원전체보수승인
    - 임원전체보수유형
    - 미등기임원보수
    - 주식총수
