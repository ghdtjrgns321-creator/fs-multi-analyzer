# 사업보고서 원문 "검토 관심 공시 종류" 내용어 baseline (S7 Step3)
#
# 목적: 사업보고서 PART 텍스트에서 감사인이 검토하는 공시 종류(우발·소송·특수관계자·메자닌·
#   계속기업 등)가 "실제 내용이 있는" 섹션인지 가려, Phase2 LLM에 넘길 청크를 좁힌다.
#   부정 확정이 아니라 "검토 관심 공시 종류" 식별이다(공시의 대부분은 정상). 회사별 본체 식별은
#   온보딩 LLM(B안)이 맡고, 이 baseline은 콜드스타트 fallback이다.
#
# 근거: 층화 샘플 301 회사연도(신 112 / 구 189, data/backtest/_s7_sample) 원문을 직접 통독하고
#   전수 grep해 도출(2026-06-15 측정). 각 term 뒤 (N%)는 샘플에서 그 단어가 나온 파일 비율.
#
# 설계(2단 + NULL): 고빈도어는 회계정책 보일러플레이트라 변별력이 없다(우발부채 96%, 담보 100%는
#   거의 모든 주석에 등장). 그래서 두 층으로 나눈다.
#   - anchors      : 공시 종류 섹션의 "위치"를 찾는 식별어. 섹션 존재 자체는 흔하다.
#   - event_signals: 그 섹션에 "실제 검토거리"가 있음을 시사하는 저빈도 이벤트어(과징금 14%, 자본잠식 4%).
#   - null_markers : "해당사항 없음"류. 앵커가 있어도 섹션이 이것뿐이면 빈 섹션이다(검토 대상 아님).
#   시대 변형(우발부채↔우발채무, 대주주↔이해관계자)은 다중 표기로 흡수한다.

# 빈 섹션(검토거리 없음) 판정용. 섹션 본문이 사실상 이 표지로만 이뤄지면 제외한다.
null_markers: ["해당사항이 없", "해당 사항이 없", "해당사항 없음", "해당없음", "기재를 생략", "미달하므로"]

disclosure_types:

  소송_분쟁:
    part_hint: [XI, III]
    anchors: [소송, 계류, 피고]                       # 소송 85% 계류 50% 피고 42%
    event_signals: [손해배상, 패소, 배상, 분쟁, 가처분, 중재]   # 손해배상 29% 분쟁 10% 가처분 3% 중재 5%

  제재_규제:
    part_hint: [XI]
    anchors: [제재, 증권선물위원회]                     # 제재 79% 증선위 21%
    event_signals: [과징금, 벌금, 과태료, 시정명령, 영업정지, 경고]  # 과징금 14% 과태료 11% 벌금 9% 시정명령 8%

  우발_약정:
    part_hint: [XI, III]
    anchors: [우발부채, 우발채무, 약정사항, 충당부채]      # 우발부채 96% 우발채무(구) 81% 충당부채 98%
    event_signals: [손실부담계약, 채무인수, 약정위반]        # 손실부담계약 21% 채무인수 46%

  담보_보증:
    part_hint: [XI, III]
    anchors: [담보, 지급보증, 채무보증, 금융보증, 견질]    # 담보 100% 지급보증 96% 채무보증 76% 견질 86%
    event_signals: [연대보증, 신용보강, 담보부족, 채무인수약정]   # 연대보증 36% 신용보강 54%

  메자닌_자금조달:
    part_hint: [III]
    anchors: [전환사채, 신주인수권, 내재파생]            # 전환사채 63% 신주인수권(구 워런트) 56% 내재파생 83%
    event_signals: [리픽싱, 전환가액, 콜옵션, 교환사채, 전환우선주]  # 리픽싱 3% 전환가액 12% 콜옵션 9% 교환사채 10%

  특수관계_대주주:
    part_hint: [X, III]
    anchors: [특수관계자, 대주주, 이해관계자, 대여금]      # 특수관계자 100% 대주주 95% 이해관계자(구) 96% 대여금 91%
    event_signals: [신용공여, 자금대여, 자산양수도, 채무보증]    # 자금대여 17% 자산양수도 68% (대주주 신용공여는 원칙 금지 항목)

  연결_지배구조:
    part_hint: [III, IX]
    anchors: [종속기업, 지배력, 비지배지분, 사업결합, 타법인출자]  # 종속기업 98% 지배력 90% 사업결합 96% 타법인출자 100%
    event_signals: [연결범위, 합병, 영업양수도, 지배력상실, 청산]   # 연결범위(변동) 44% 합병 86% 영업양수도 12%

  손상:
    part_hint: [III]
    anchors: [손상차손, 회수가능액, 현금창출단위, 영업권]   # 손상차손 100% 회수가능액 98% CGU 86% 영업권 94%
    event_signals: [손상징후, 손상차손인식, 환입]           # 손상징후 44%

  계속기업_상장위험:
    part_hint: [XI, V, III]
    anchors: [계속기업]                               # 계속기업 63%
    event_signals: [존속능력, 관리종목, 자본잠식, 영업손실, 의견거절, 한정의견, 부적정, 상장폐지, 지정유예]
    # 존속능력 19% 관리종목 8% 자본잠식 4% 영업손실 12% 의견거절 2% 한정의견 0.3% 부적정 3% 상장폐지 4%

  감사_내부통제:
    part_hint: [V]
    anchors: [내부회계관리제도, 특기사항, 강조사항, 핵심감사사항]  # ICFR 79% 특기사항(구) 62% 강조사항 40% KAM(신) 37%
    event_signals: [중요한 취약점, 비적정, 의견거절, 부적정]      # 중요한 취약점 8% (대부분 "취약점 발견되지 아니" 부정문)

  파생_시장위험:
    part_hint: [III]
    anchors: [파생상품, 위험회피, 이자율위험]            # 파생상품 97% 위험회피 97% 이자율위험 72%
    event_signals: [환위험, 외화환산, 통화선도, 위험회피회계]    # 환위험 46% 외화환산 39%

  차입_유동성:
    part_hint: [III]
    anchors: [차입금, 부채비율, 유동성위험]              # 차입금 100% 부채비율 41% 유동성위험 73%
    event_signals: [기한이익, 채무불이행, 순차입금, 상장폐지, 연체]  # 기한이익(상실) 3% 채무불이행 87%(다수 정책문) 상장폐지 4%

  재작성_정정:
    part_hint: [III, XI]
    anchors: [소급, 재작성, 정정]                       # 소급 43% 재작성 38% 정정 16%
    event_signals: [전기오류, 회계처리오류, 감독지침, 정정신고, 오류수정]  # 전기오류 5% 회계처리오류 0.3% 감독지침 1%
