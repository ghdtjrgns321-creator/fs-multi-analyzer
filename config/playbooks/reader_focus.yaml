# Layer 1 서술 리더 focus 배정. 설계 §4(macro-block 5종·2사 전수판정 근거).
# 각 블록 = 사업보고서가 준 목차 배치(자의적 아님). parts=담당 PART 로마숫자, focus=리더 프롬프트.
# XII(상세표=구조화 API 중복)는 여기 없음 → reader_focus None(서술 리더 미배정).
# III은 2026-08 편입: 결정론(Phase1)이 담당하는 건 재무 '수치'지 주석 '서술'이 아니다. XBRL 주석
# 태깅은 2023년 이후 대형사만이라, 그 이전 회사연도의 주석은 여기서만 닿는다(실측 근거: 2022년
# 이하 주석 실질 0건 99.5~100%). 삼성·두산 2024 실측에서 환각 0·인용 숫자 916개 전건 원문 확인.
# III은 길어(최대 66만 자) chunking.chunk_part가 잘라 순차 투입한다.
# 스코프: 제조업. 계산 금지(원문 수치 인용만) 원칙은 시스템 프롬프트(reader.py)에서 공통 강제.
blocks:
  financial_notes:  # ① 재무제표 주석(III)
    parts: ["III"]
    focus: >-
      재무제표 주석 초점: 이 파트는 재무제표와 그 주석 본문이다. (1) 특수관계자 거래 — 상대방,
      거래 성격(매출·매입·대여·차입·지급보증), 금액, 채권채무 잔액. (2) 우발부채·약정·담보 —
      계류중 소송(원고·피고·청구금액·진행상태), 지급보증·채무보증(상대방·한도), 담보제공자산
      (종류·장부금액·담보권자), 주요 약정(한도·조건). (3) 차입금·사채 조건 — 차입처, 이자율,
      만기, 담보·보증 여부, 재무특약(covenant)·기한이익상실 조항. 그 밖에 중요 회계추정·계속기업
      불확실성·후속사건·손상·재고자산 평가충당금·매출채권 대손도 개별 항목으로. 본표의 단순 계정
      잔액 나열은 제외한다(결정론 코드가 담당). 금액은 표 헤더의 단위를 함께 적는다.
  business_operations:  # ② 사업·영업
    parts: ["I", "II"]
    focus: >-
      사업·영업 초점: 회사·연결범위·신용평가, 제품/서비스별 매출과 비중, 가동률·생산능력,
      유형자산 취득·처분, 시장위험·환·이자율·파생상품 계약, 주요 R&D·수주. 회사 개요·연혁의
      지배구조 단서(최대주주·설립배경)도 포착. 일반 나열(전 제품목록 등)은 요약·개수로만.
  mgmt_audit:  # ③ 경영진단·감사
    parts: ["IV", "V"]
    focus: >-
      경영진단·감사 초점: 경영진의 재무상태·영업실적 해설, 유동성·자금조달, 부외거래,
      중요한 회계추정·판단(이익조정 여지), 외부감사인 의견, 핵심감사사항(KAM)의 각 항목.
      KAM·중요 회계추정은 반드시 개별 항목으로.
  governance_related_party:  # ④ 지배구조·특수관계
    parts: ["VI", "VII", "VIII", "IX", "X"]
    focus: >-
      지배구조·특수관계 초점: 이사회 주요 의결안건, 감사제도·내부통제 취약, 최대주주 지분·변동,
      특수관계(가족)·최대주주 관계 임원, 5억원 이상 고액보수·임원 급여총액, 계열사 채무보증·지급보증,
      대주주·이해관계자 거래. 일반 임직원 명세·전 계열사 목록은 요약·개수로, 감사 고가치는 개별 항목으로.
  contingency_sanctions:  # ⑤ 우발·제재
    parts: ["XI"]
    focus: >-
      우발·제재 초점: 중요한 소송, 우발부채, 채무보증·담보, 약정, 금전적 제재·수사기관 조치,
      공시내용 진행·변경. 각 건을 개별 항목으로(금액·상대방·상태 인용).
