# 조사원(investigator) 설정 — PLAN.md §5 조사 단계. 임계·가중치는 코드에 박지 않는다(원칙 3).
investigation:
  gate: # 결정론 게이트 — 아래 둘 다 충족하면 "분해가 원인 설명 완료" → 도구 루프 생략
    residual_pct_max: 20.0 # |미설명 잔차%| 상한
    top_leaf_pct_min: 60.0 # 최대 leaf |기여율| 하한
  loop:
    max_requests: 8 # 도구 루프 LLM 왕복 상한(비용 가드)
# 우선순위 가중치(materiality 0.35 · votes 0.30 · anomaly 0.15 · confidence 0.20)는 폐지했다.
# 가중치는 성분별 근거를 댈 수 없고("왜 금액이 표수보다 0.05 무거운가") 단위가 다른 값을 한
# 축에 합쳐 "왜 이 카드가 위인가"에 답하지 못한다. 정렬은 src/report/card_order.py의 사전식
# 비교(정상우세 하단 → 표수 → 금액)가 단독 담당한다.
external:
  hard_cap: 30 # 폭주 방지 안전핀 — 선정 기준 아님(선정 = 조사 미해결 카드 전부)
